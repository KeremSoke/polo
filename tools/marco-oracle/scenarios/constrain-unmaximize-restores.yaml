description: Unmaximizing returns to the size and position before maximizing.
steps:
  - map: {id: a, size: [400, 300], position: [100, 100], position_source: user}
  - request_state: {id: a, state: [maximized_vert, maximized_horz]}
  - request_state: {id: a, action: remove, state: [maximized_vert, maximized_horz]}
