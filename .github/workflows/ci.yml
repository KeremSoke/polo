# Polo CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Fedora 44 dependencies: keep in sync with README.md "Building".
  FEDORA_DEPS: >-
    gcc gcc-c++ git meson ninja-build python3 pkgconf-pkg-config
    vala valadoc
    glib2-devel dconf-devel gtk3-devel gtk-layer-shell-devel
    wayland-devel wayland-protocols-devel libxkbcommon-devel
    libinput-devel libevdev-devel libseat-devel systemd-devel
    libdrm-devel mesa-libgbm-devel libglvnd-devel libdisplay-info-devel
    pixman-devel cairo-devel pango-devel lcms2-devel libpng-devel
    libxcb-devel xcb-util-wm-devel xcb-util-errors-devel xcb-util-cursor-devel
    libXcursor-devel xorg-x11-server-Xwayland-devel
    libcanberra-devel pulseaudio-libs-devel libSM-devel libICE-devel
    mate-desktop-devel
    python3-xlib python3-pyyaml python3-gobject json-glib-devel marco
  # What the tests run: Xwayland itself, keymaps, software GL, a session bus,
  # and the MATE schemas, icons and image loaders the session tests read.
  FEDORA_TEST_DEPS: >-
    xorg-x11-server-Xwayland xkeyboard-config mesa-dri-drivers mesa-libEGL
    dbus-daemon procps-ng desktop-file-utils shared-mime-info
    mate-session-manager mate-power-manager mate-themes adwaita-icon-theme glycin-loaders gtk4
    libasan libubsan
  # io.elementary.vala-lint has no recent release; pin a commit.
  VALA_LINT_REV: 34124fb326f63d9f24339175818425c310ca747c

jobs:
  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: strict
            setup: -Dstrict=true -Dtest-protocol=true -Ddebug-kill=true
          - name: sanitizers
            setup: -Dstrict=true -Dtest-protocol=true -Ddebug-kill=true -Db_sanitize=address,undefined -Db_lundef=false
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS $FEDORA_TEST_DEPS
      - uses: actions/checkout@v4
      - name: Cache Weston checkout
        uses: actions/cache@v4
        with:
          path: subprojects/weston
          key: weston-${{ hashFiles('subprojects/weston.wrap', 'subprojects/packagefiles/weston/**') }}
      - name: Configure
        run: meson setup build ${{ matrix.setup }}
      - name: Build
        run: ninja -C build
      # Xwayland listens in /tmp/.X11-unix, which the container lacks.
      - name: X socket directory
        run: mkdir -p /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix
      - name: Test
        run: meson test -C build --print-errorlogs --no-suite perf
      - name: Application matrix
        env:
          POLO_APP_MATRIX: 1
        run: meson test -C build --suite apps --print-errorlogs
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.name }}
          path: build/meson-logs/

  # The tests need -Dtest-protocol=true; this builds what users build, with
  # every option at its default.
  default-build:
    name: Build (default options)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS
      - uses: actions/checkout@v4
      - name: Cache Weston checkout
        uses: actions/cache@v4
        with:
          path: subprojects/weston
          key: weston-${{ hashFiles('subprojects/weston.wrap', 'subprojects/packagefiles/weston/**') }}
      - name: Configure
        run: meson setup build
      - name: Build
        run: ninja -C build
      # Nothing for tests or debugging is offered in what users build.
      - name: Release surfaces
        run: meson test -C build --suite release --print-errorlogs

  # The protocol fuzzers replay their committed corpora once: a crash,
  # leak or hang on any of them fails the job.
  fuzz-regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS clang compiler-rt
      - uses: actions/checkout@v4
      - name: Cache Weston checkout
        uses: actions/cache@v4
        with:
          path: subprojects/weston
          key: weston-${{ hashFiles('subprojects/weston.wrap', 'subprojects/packagefiles/weston/**') }}
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          meson setup build -Dfuzz=true -Dshell-ui=false -Dxwayland=false
          -Db_sanitize=address,undefined -Db_lundef=false
      - name: Build
        run: >-
          ninja -C build tests/fuzz/fuzz-protocols
          subprojects/weston/libweston/backend-headless/headless-backend.so
      - name: Replay the corpora
        run: meson test -C build --no-rebuild --suite fuzz --print-errorlogs
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-fuzz
          path: build/meson-logs/

  # The budgets of plan M16.2 on headless Polo (perf-budgets), and the numbers
  # against tests/perf/baseline.json: more than 10% worse is flagged.
  perf:
    name: Performance
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS $FEDORA_TEST_DEPS
      - uses: actions/checkout@v4
      - name: Cache Weston checkout
        uses: actions/cache@v4
        with:
          path: subprojects/weston
          key: weston-${{ hashFiles('subprojects/weston.wrap', 'subprojects/packagefiles/weston/**') }}
      - name: Configure
        run: meson setup build -Dtest-protocol=true -Dbuildtype=release
      - name: Build
        run: ninja -C build
      - name: Budgets
        run: meson test -C build --suite perf --print-errorlogs
      - name: Against the baseline
        if: always()
        run: python3 tools/perf-compare.py tests/perf/baseline.json build/tests/protocol/perf-results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: build/tests/protocol/perf-results.json

  lint:
    name: Lint and boundary
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS clang-tools-extra vala-devel json-glib-devel
      - uses: actions/checkout@v4
      - name: Build vala-lint
        run: |
          git clone https://github.com/vala-lang/vala-lint.git /tmp/vala-lint
          git -C /tmp/vala-lint checkout "$VALA_LINT_REV"
          meson setup /tmp/vala-lint/build /tmp/vala-lint --prefix=/usr
          ninja -C /tmp/vala-lint/build install
      - name: Boundary check
        run: python3 tools/check-boundary.py
      - name: clang-format
        run: find lib -name '*.[ch]' -print0 | xargs -0 clang-format --dry-run --Werror
      - name: vala-lint
        run: io.elementary.vala-lint --config vala-lint.conf src tests/vapi

  scan-build:
    name: Static analysis
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install $FEDORA_DEPS clang clang-analyzer
      - uses: actions/checkout@v4
      - name: Cache Weston checkout
        uses: actions/cache@v4
        with:
          path: subprojects/weston
          key: weston-${{ hashFiles('subprojects/weston.wrap', 'subprojects/packagefiles/weston/**') }}
      # Analyses every C file the build compiles, including valac's generated
      # C, whose unread temporaries are not Polo's to fix. libweston, the
      # vendored Weston XWM and the test helpers are excluded.
      - name: scan-build
        run: |
          SB="scan-build --status-bugs -disable-checker deadcode.DeadStores -o scan-results"
          for dir in subprojects lib/xwm/weston tests; do
            SB="$SB --exclude $PWD/$dir --exclude ../$dir"
          done
          $SB meson setup build-scan -Dtest-protocol=true
          $SB ninja -C build-scan
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build
          path: scan-results/
