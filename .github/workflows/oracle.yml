# Marco oracle refresh. Run by hand, typically when bumping the
# Marco reference: it regenerates every fixture against the real
# Marco and fails if any committed fixture would change.
name: Marco oracle

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per scenario that must agree
        default: "2"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Marco and the oracle's dependencies
        run: >-
          dnf -y install marco mate-themes google-noto-sans-fonts
          xorg-x11-server-Xvfb dbus-daemon python3 python3-xlib python3-pyyaml
      - uses: actions/checkout@v4
      - name: Check the Marco version matches the fixtures
        run: |
          version=$(rpm -q --qf '%{VERSION}' marco)
          grep -q "MARCO_VERSION = \"$version\"" tools/marco-oracle/run.py || {
            echo "Fedora ships Marco $version; fixtures are for another release."
            exit 1
          }
      - name: Regenerate and compare
        run: python3 -I tools/marco-oracle/run.py --all --check --repeat "${{ inputs.repeat }}"
